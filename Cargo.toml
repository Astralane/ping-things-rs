[package]
name = "ping-things-rs"
version = "0.1.0"
edition = "2021"

[dependencies]
solana-client = { version = "=3.0.0" }
solana-rpc-client-api = { version = "=3.0.0" }
solana-sdk = "=3.0.0"
solana-transaction-status = "=3.0.0"
# New component crates for removed modules 
solana-commitment-config = "=3.0.0"
solana-system-interface = { version = "=3.0.0", features = ["bincode"] }
solana-compute-budget-interface = "=3.0.0"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.12"
simplelog = "0.12.2"
serde_json = "1.0.128"
serde = { version = "1.0.210", features = ["derive"] }
chrono = "0.4"
reqwest = { version = "0.11.27", features = ["json"] }
csv = "1.1"
# spl-governance = "4.0.0"  # Temporarily disabled for Solana v3 upgrade
rand = "0.8.5"
futures = "0.3.30"
dotenv = "0.15.0"
anyhow = "1.0.89"
serde_yaml = "0.9.34+deprecated"
tracing-subscriber = { version = "0.3.18", features = ["env-filter"] }
tracing = "0.1.40"
log = "0.4.22"
async-trait = "0.1.83"
bincode = "1.3.3"
base64 = "0.22.1"
astralane-quic-client = { git = "https://github.com/Astralane/astralane-quic-client" }
quinn = "0.11"
solana-tls-utils = "=3.0.0"
solana-keypair = "=3.0.0"
dashmap = "6"